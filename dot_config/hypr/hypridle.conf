# hypridle — idle management
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# The locker is named in exactly ONE place: general:lock_cmd. Everything else —
# sleep, the idle timer, SUPER+L — emits logind's Lock signal via
# `loginctl lock-session` and hypridle runs lock_cmd in response. That is the
# shape hypridle documents, and it means changing lockers is a one-line edit.

general {
    # The single definition of "lock this session".
    # faillock --reset clears any pam lockout tally so a previous failed unlock
    # can't block this one. Separated by `;` deliberately: it used to be
    # `faillock --reset && hyprlock`, which skipped locking entirely whenever
    # faillock returned non-zero.
    # Require authentication immediately; render without waiting for resources.
    lock_cmd = faillock --reset ; pidof hyprlock || hyprlock --grace 0 --immediate-render

    # Does NOT start the locker itself — it emits logind's Lock signal, which
    # comes back round to lock_cmd above. Keeping these apart is what lets
    # inhibit_sleep hold the sleep inhibitor until the session is locked.
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3

    # Wake immediately, then repeat after the GPU/output has had time to resume.
    # The second enable is idempotent: it does not toggle or blank the display.
    # Use ; so the retry still runs if the first dispatch fails.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; sleep 1; hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Restore all displays after a successful unlock as well.
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Respect media playback, the bar's caffeine toggle, and systemd idle blocks.
    ignore_dbus_inhibit = false
    ignore_wayland_inhibit = false
    ignore_systemd_inhibit = false
}

# ▓▒░ 10 min → LOCK
# Lock comes BEFORE the display blanks. The previous order was inverted —
# blank at 600s, lock at 900s — which left a five-minute window where the screen
# was dark and the session still unlocked, so a nudge of the mouse landed
# straight on the desktop. A dark screen that isn't locked reads as locked.
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# ▓▒░ 10.5 min → DISPLAY OFF
# 30s after the lock is up, so the monitor powers down over a locked session.
listener {
    timeout    = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# ▓▒░ 45 min → SUSPEND
# before_sleep_cmd fires on the way down, so this is locked too.
listener {
    timeout    = 2700
    # Start GPU sleep from an active output, not the long-idle DPMS-off state.
    # The session is already locked by the 600-second listener.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && sleep 1 && systemctl suspend
}
